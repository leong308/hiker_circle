<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HikerCircle live location share">
  <title>HikerCircle Live Location</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=hc-2">
  <link rel="apple-touch-icon" href="/privacy-assets/app-icon.png">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f2f7;
      color: #111111;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f2f7;
    }

    main {
      width: min(680px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0;
      line-height: 1.1;
    }

    p {
      margin: 6px 0 0;
      color: #6e6e73;
      line-height: 1.45;
    }

    .panel {
      margin-top: 16px;
      overflow: hidden;
      border-radius: 8px;
      background: white;
    }

    .map {
      width: 100%;
      height: 280px;
      border: 0;
      background: #eaf7ee;
    }

    .details {
      padding: 14px;
    }

    .coordinate {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      color: #111111;
      overflow-wrap: anywhere;
    }

    .updated {
      margin-top: 4px;
      font-size: 14px;
      color: #6e6e73;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 14px;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 8px;
      background: #34a853;
      color: white;
      font-weight: 700;
      text-decoration: none;
    }

    .empty {
      padding: 20px;
      border-radius: 8px;
      background: white;
    }
  </style>
</head>
<body>
  <main>
    <h1>HikerCircle Live Location</h1>
    <p id="status">Loading shared location...</p>
    <section id="content" class="panel" hidden>
      <img id="map" class="map" alt="Live location on Mapbox" style="object-fit:contain">
      <iframe id="fallbackMap" class="map" title="Live location map — OpenStreetMap fallback" hidden></iframe>
      <div class="details">
        <p id="coordinate" class="coordinate"></p>
        <p id="updated" class="updated"></p>
        <a id="mapLink" class="button" target="_blank" rel="noreferrer">Open in Google Maps</a>
      </div>
    </section>
    <section id="empty" class="empty" hidden>
      This live location link is inactive or unavailable.
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAEnKwoQqGoJaQ23x4QOH0_TSWB7DU3Mxk",
      authDomain: "hiker-circle.firebaseapp.com",
      projectId: "hiker-circle",
      storageBucket: "hiker-circle.firebasestorage.app",
      messagingSenderId: "41069899337",
      appId: "1:41069899337:web:04b79b9aaf104702a61998"
    };

    const params = new URLSearchParams(window.location.search);
    const shareId = params.get("share");
    const status = document.getElementById("status");
    const content = document.getElementById("content");
    const empty = document.getElementById("empty");
    const map = document.getElementById("map");
    const fallbackMap = document.getElementById("fallbackMap");
    const mapConfig = fetch('/map-config.json').then(response => response.ok ? response.json() : {})
      .catch(() => ({}));
    let mapGeneration = 0;
    let lastCoordinates = '';
    let expiryTimer = null;

    async function updateMap(lat, lng) {
      const coordinates = `${lat},${lng}`;
      if (coordinates === lastCoordinates) return;
      lastCoordinates = coordinates;
      const generation = ++mapGeneration;
      const config = await mapConfig;
      if (generation !== mapGeneration) return;
      function fallback() {
        if (generation !== mapGeneration) return;
        map.hidden = true;
        fallbackMap.hidden = false;
        const bbox = [lng - 0.008, lat - 0.005, lng + 0.008, lat + 0.005].join(',');
        fallbackMap.src = `https://www.openstreetmap.org/export/embed.html?bbox=${encodeURIComponent(bbox)}&layer=mapnik&marker=${lat},${lng}`;
      }
      if (typeof config.mapboxAccessToken !== 'string' || !config.mapboxAccessToken.startsWith('pk.')) { fallback(); return; }
      const image = new Image();
      const timeout = setTimeout(fallback, 15000);
      image.onload = () => {
        clearTimeout(timeout);
        if (generation !== mapGeneration) return;
        map.src = image.src;
        map.hidden = false;
        fallbackMap.hidden = true;
        fallbackMap.removeAttribute('src');
      };
      image.onerror = () => { clearTimeout(timeout); fallback(); };
      image.src = `https://api.mapbox.com/styles/v1/mapbox/outdoors-v12/static/pin-s+23964f(${lng},${lat})/${lng},${lat},16/640x400@2x?access_token=${encodeURIComponent(config.mapboxAccessToken)}`;
    }
    const coordinate = document.getElementById("coordinate");
    const updated = document.getElementById("updated");
    const mapLink = document.getElementById("mapLink");

    function showEmpty(message) {
      clearTimeout(expiryTimer);
      expiryTimer = null;
      mapGeneration++;
      lastCoordinates = '';
      map.removeAttribute('src');
      fallbackMap.removeAttribute('src');
      status.textContent = message;
      content.hidden = true;
      empty.hidden = false;
    }

    function showLocation(data) {
      clearTimeout(expiryTimer);
      const expiresAtMillis = typeof data.expiresAt?.toMillis === 'function'
        ? data.expiresAt.toMillis() : Date.parse(data.expiresAtLocal || '');
      if (!Number.isFinite(expiresAtMillis) || expiresAtMillis <= Date.now()) {
        showEmpty("This live location link has expired.");
        return;
      }
      expiryTimer = setTimeout(() => showEmpty("This live location link has expired."),
        Math.min(2147483647, Math.max(0, expiresAtMillis - Date.now())));
      const location = data.latestLocation;
      if (!data.isActive || !location || !Number.isFinite(location.latitude) || !Number.isFinite(location.longitude) || Math.abs(location.latitude) > 85.05112878 || Math.abs(location.longitude) > 180) {
        showEmpty("This live location link is inactive.");
        return;
      }

      const lat = location.latitude;
      const lng = location.longitude;
      const link = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
      const timestamp = location.capturedAtLocal || data.updatedAtLocal || "";

      status.textContent = "Live location active";
      coordinate.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
      updated.textContent = timestamp ? `Updated ${new Date(timestamp).toLocaleString()}` : "Updated recently";
      updateMap(lat, lng);
      mapLink.href = link;
      content.hidden = false;
      empty.hidden = true;
    }

    if (!shareId || !/^[A-Za-z0-9_-]{8,240}$/.test(shareId)) {
      showEmpty("Missing or invalid live location share id.");
    } else {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      onSnapshot(
        doc(db, "live_location_shares", shareId),
        (snapshot) => {
          if (!snapshot.exists()) {
            showEmpty("This live location link is unavailable.");
            return;
          }
          showLocation(snapshot.data());
        },
        () => showEmpty("Unable to load this live location.")
      );
    }
  </script>
</body>
</html>
